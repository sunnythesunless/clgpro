services:
  - type: web
    name: medical-image-reporter
    env: docker
    dockerfilePath: Dockerfile
    plan: standard
    region: oregon
    envVars:
      - key: APP_NAME
        value: Medical Image Reporter
      - key: DEBUG
        value: "false"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8000"
      - key: ALLOWED_ORIGINS
        value: '["*"]'
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/medical_reports.db
      - key: SECRET_KEY
        generateValue: true
      - key: MODEL_NAME
        value: Salesforce/blip-image-captioning-large
      - key: DEVICE
        value: cpu
      - key: UPLOAD_DIR
        value: ./data/uploads
      - key: MAX_FILE_SIZE_MB
        value: "10"
    disk:
      name: medreporter-disk
      mountPath: /app/data
      sizeGB: 10
